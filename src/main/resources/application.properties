spring.application.name=optical-manage
server.port=${SERVER_PORT:8089}

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:your-database-username-here}
spring.datasource.password=${DB_PASSWORD:your-database-password-here}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP 连接池优化配置
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=HikariPool-optical
# 连接池预热，启动时就创建连接
spring.datasource.hikari.initialization-fail-timeout=0

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.type-handlers-package=com.optical.manage.handler

# ==================== 日志配置 ====================
# 日志级别: TRACE < DEBUG < INFO < WARN < ERROR
logging.level.root=INFO
logging.level.com.optical.manage=DEBUG
logging.level.com.optical.manage.aspect=INFO
logging.level.com.optical.manage.mapper=DEBUG

# 日志输出格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# 日志文件配置（可选）
# logging.file.name=logs/optical-manage.log
# logging.logback.rollingpolicy.max-file-size=10MB
# logging.logback.rollingpolicy.max-history=30

# 暴露所有端点（生产环境建议只暴露必要的）
management.endpoints.web.exposure.include=*
# 启用健康检查详情
management.endpoint.health.show-details=always
